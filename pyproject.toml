[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velcore"
version = "0.1.0"
description = "VelCore - Multimodal Vision-Language Model"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "VelCore Team"},
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.30.2",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "datasets>=2.15.0",
    "huggingface-hub>=0.19.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.15.0",
]

[tool.setuptools]
py-modules = ["architecture", "builder", "tokenizer", "model", "main", "generate_image", "evaluate_model", "ask_model", "train_final", "train_geometry", "train_gsm8k", "train_socratic"]
